services:
  mongo:
    image: mongo:7
    container_name: nif-abstractor-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - nif-abstractor-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: nif-abstractor-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8011:8010"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: nif_abstractor
      CONTENT_STORE_ROOT: /app/.content-store
      CORS_ORIGINS: http://localhost:3001,http://127.0.0.1:3001,http://localhost:3000,http://127.0.0.1:3000
      ALLOW_INSECURE_TLS: "${ALLOW_INSECURE_TLS:-true}"
      STRICT_TLS_VERIFY: "${STRICT_TLS_VERIFY:-false}"
      NIFI_URL: "${NIFI_URL:-https://nifi.datapasc.com/}"
      NIFI_USERNAME: "${NIFI_USERNAME:-admin}"
      NIFI_PASSWORD: "${NIFI_PASSWORD:-}"
      KAFKA_BOOTSTRAP_SERVERS: "${DOCKER_KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:19092}"
      APICURIO_URL: "${APICURIO_URL:-https://apicurio.datapasc.com/}"
      KAFBAT_URL: "${KAFBAT_URL:-https://kafbat.datapasc.com/}"
      KAFBAT_USERNAME: "${KAFBAT_USERNAME:-}"
      KAFBAT_PASSWORD: "${KAFBAT_PASSWORD:-}"
    volumes:
      - nif-abstractor-content-store:/app/.content-store
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ""
    container_name: nif-abstractor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  nif-abstractor-mongo-data:
  nif-abstractor-content-store:
